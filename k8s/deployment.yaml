# Manifestos de ESTUDO (não testados num cluster real). Cobre os pontos centrais de um
# Deployment pronto pra produção: probes, requests/limits, rolling update, HPA, preStop.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: merchant-support-lab-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } # nunca cai abaixo de 2 pods durante o deploy
  selector:
    matchLabels: { app: merchant-support-lab-api }
  template:
    metadata:
      labels: { app: merchant-support-lab-api }
    spec:
      terminationGracePeriodSeconds: 30 # tem de ser maior que o force-exit do server.ts (25s)
      containers:
        - name: api
          image: registry.example.com/merchant-support-lab:0.1.0 # tag imutável, nunca :latest
          ports: [{ containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: merchant-support-lab-config }
            - secretRef: { name: merchant-support-lab-secrets } # segredos NUNCA no ConfigMap nem no Git
          resources:
            requests: { cpu: 100m, memory: 192Mi } # o scheduler usa isto para escolher o nó
            limits: { memory: 384Mi } # estourou => OOMKilled. Sem limit de CPU de propósito (evita throttling)
          startupProbe: # dá tempo de subir antes de a liveness começar a cobrar
            httpGet: { path: /health/live, port: 3000 }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe: # falhou => reinicia o container
            httpGet: { path: /health/live, port: 3000 }
            periodSeconds: 10
          readinessProbe: # falhou => sai do Service (sem tráfego), sem reiniciar
            httpGet: { path: /health/ready, port: 3000 }
            periodSeconds: 5
          lifecycle:
            preStop: # dá tempo do Service/ingress remover o pod antes do SIGTERM chegar na app
              exec: { command: ["sleep", "5"] }
---
apiVersion: v1
kind: Service
metadata:
  name: merchant-support-lab-api
spec:
  selector: { app: merchant-support-lab-api }
  ports: [{ port: 80, targetPort: 3000 }]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: merchant-support-lab-config
data:
  NODE_ENV: production
  LOG_LEVEL: info
  KAFKA_GROUP_ID: merchant-support-lab-orders
  KAFKA_TOPIC_ORDERS: lab.orders.v1
  KAFKA_TOPIC_ORDERS_DLQ: lab.orders.v1.dlq
---
# Pods dividem as partições do mesmo consumer group. Mais réplicas que partições = pods ociosos.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: merchant-support-lab-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: merchant-support-lab-api }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
